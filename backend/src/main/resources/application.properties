spring.application.name=ventes

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/pharmaciedb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

app.security.enabled=${APP_SECURITY_ENABLED:false}
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:changeme}

app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:4200}
